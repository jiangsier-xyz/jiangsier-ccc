services:
  ccc:
    image: ${CCC_IMAGE:-jiangsier/ccc:1.5}
    env_file:
      - path: .env
        required: false
    network_mode: host
    environment:
      PATH: /home/node/.local/bin:/usr/local/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      TERM: xterm-256color
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    volumes:
      - ${CCC_CONFIG_DIR:-$HOME/.claude}:/home/node/.claude
      - ${CCC_PROJECT_DIR:-$PWD}:/home/node/${CCC_PROJECT:-}
      - $HOME/.ssh:/home/node/.ssh
    working_dir: /home/node/${CCC_PROJECT:-}
    stdin_open: true
    tty: true
    init: true
    entrypoint: ["claude"]

